<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <!-- Sky and Rain -->
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <g stroke="#cbd5e1" stroke-width="1.5" opacity="0.4" stroke-dasharray="10,15">
    <line x1="50" y1="0" x2="20" y2="500" />
    <line x1="150" y1="0" x2="120" y2="500" />
    <line x1="250" y1="0" x2="220" y2="500" />
    <line x1="350" y1="0" x2="320" y2="500" />
    <line x1="450" y1="0" x2="420" y2="500" />
    <line x1="550" y1="0" x2="520" y2="500" />
    <line x1="650" y1="0" x2="620" y2="500" />
    <line x1="750" y1="0" x2="720" y2="500" />
  </g>

  <!-- Mountain Slopes -->
  <polygon points="0,150 250,50 480,220 180,380 0,350" fill="url(#mountainGrad)" />
  <polygon points="350,180 620,40 800,160 800,450 350,420" fill="#1e293b" />

  <!-- Tunnel Structure -->
  <path d="M 220,380 L 220,240 Q 320,180 420,240 L 420,380 Z" fill="#475569" stroke="#0f172a" stroke-width="8" />
  <path d="M 250,380 L 250,260 Q 320,210 390,260 L 390,380 Z" fill="#0f172a" />

  <!-- Road -->
  <polygon points="0,480 800,480 800,380 0,380" fill="#334155" />
  <line x1="0" y1="430" x2="800" y2="430" stroke="#facc15" stroke-width="6" stroke-dasharray="25,20" />

  <!-- Landslide Mud and Boulders Blockade -->
  <path d="M 120,240 Q 280,260 320,320 Q 360,370 480,370 Q 560,390 600,450 L 150,480 Z" fill="url(#mudGrad)" />
  <!-- Boulders -->
  <circle cx="280" cy="380" r="35" fill="#57534e" stroke="#292524" stroke-width="4" />
  <circle cx="340" cy="410" r="28" fill="#44403c" stroke="#292524" stroke-width="3" />
  <circle cx="220" cy="420" r="22" fill="#78716c" stroke="#292524" stroke-width="3" />
  <circle cx="420" cy="390" r="42" fill="#57534e" stroke="#1c1917" stroke-width="4" />

  <!-- Warning Banner Overlay -->
  <rect x="20" y="20" width="380" height="75" rx="10" fill="#991b1be6" stroke="#f87171" stroke-width="2" />
  <text x="40" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">NH-6 SONAPUR TUNNEL BLOCKED</text>
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="13" fill="#fecaca">BRO Clearance Operations In Progress | Active Debris</text>
</svg>
