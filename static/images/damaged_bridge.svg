<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="#94a3b8" />
  
  <!-- Swirling River -->
  <rect y="280" width="800" height="220" fill="url(#riverGrad)" />
  <path d="M 0,330 Q 200,310 400,340 T 800,320" stroke="#bae6fd" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M 0,400 Q 250,380 500,410 T 800,390" stroke="#7dd3fc" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Bridge Piers -->
  <rect x="150" y="240" width="45" height="180" fill="#475569" stroke="#1e293b" stroke-width="3" />
  <!-- Damaged / Tilting Pier 2 -->
  <polygon points="430,250 470,255 490,420 445,420" fill="#dc2626" stroke="#7f1d1d" stroke-width="3" />
  <line x1="435" y1="280" x2="465" y2="340" stroke="#450a0a" stroke-width="4" />
  <line x1="465" y1="340" x2="445" y2="390" stroke="#450a0a" stroke-width="4" />
  <rect x="650" y="240" width="45" height="180" fill="#475569" stroke="#1e293b" stroke-width="3" />

  <!-- Bridge Road Deck (Cracked and Sagging) -->
  <path d="M 0,230 L 410,235 Q 455,270 500,240 L 800,230 L 800,255 L 500,265 Q 455,295 410,260 L 0,255 Z" fill="#334155" stroke="#0f172a" stroke-width="2" />
  <!-- Bridge Railing with Broken Section -->
  <line x1="0" y1="215" x2="410" y2="218" stroke="#f59e0b" stroke-width="6" />
  <line x1="500" y1="222" x2="800" y2="215" stroke="#f59e0b" stroke-width="6" />

  <!-- Barrier and Danger Cones -->
  <polygon points="380,230 400,230 395,200 385,200" fill="#ea580c" />
  <polygon points="510,230 530,230 525,200 515,200" fill="#ea580c" />

  <!-- Warning Banner -->
  <rect x="20" y="20" width="420" height="75" rx="10" fill="#7f1d1de6" stroke="#fca5a5" stroke-width="2" />
  <text x="40" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">BARAK RIVER BRIDGE SCOURED</text>
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="13" fill="#fecaca">Sub-structure Crack | Trucks Barred | 4x4 & Emergency Only</text>
</svg>
