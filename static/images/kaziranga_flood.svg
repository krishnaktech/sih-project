<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="floodWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>

  <!-- Sky & Overcast -->
  <rect width="800" height="500" fill="#64748b" />

  <!-- Kaziranga Grasslands -->
  <rect y="180" width="800" height="320" fill="url(#grassGrad)" />

  <!-- Road Partially Submerged -->
  <polygon points="0,320 800,280 800,430 0,470" fill="#334155" />
  <line x1="0" y1="395" x2="800" y2="355" stroke="#facc15" stroke-width="5" stroke-dasharray="25,20" />

  <!-- Water Inundation -->
  <path d="M 0,350 Q 200,320 400,340 T 800,330 L 800,500 L 0,500 Z" fill="url(#floodWater)" opacity="0.85" />
  
  <!-- Waves & Water Level Indicator -->
  <path d="M 50,380 Q 150,370 250,380 T 450,380 T 650,380 T 800,380" stroke="#93c5fd" stroke-width="3" fill="none" />
  <path d="M 10,430 Q 120,420 220,430 T 420,430 T 620,430 T 800,430" stroke="#bfdbfe" stroke-width="2.5" fill="none" />

  <!-- Warning Depth Marker Post -->
  <rect x="260" y="270" width="16" height="150" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <rect x="260" y="270" width="16" height="20" fill="#ef4444" />
  <rect x="260" y="310" width="16" height="20" fill="#ef4444" />
  <rect x="260" y="350" width="16" height="20" fill="#ef4444" />
  <text x="285" y="315" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" stroke="#000" stroke-width="0.5">WATER DEPTH: 2.5 FT</text>

  <!-- Flood Warning Badge -->
  <rect x="20" y="20" width="410" height="75" rx="10" fill="#1e3a8ae6" stroke="#60a5fa" stroke-width="2" />
  <text x="40" y="50" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#ffffff">NH-715 KAZIRANGA SUBMERGED</text>
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="13" fill="#bfdbfe">Brahmaputra Spate | Speed Limit 20 km/h | High Clearance Only</text>
</svg>
